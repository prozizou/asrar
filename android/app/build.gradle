apply plugin: 'com.android.application'

// Signature release — lue depuis android/keystore.properties (NON versionné,
// voir keystore.properties.example) ou, à défaut, depuis les variables
// d'environnement ASRAR_KEYSTORE_FILE / ASRAR_KEYSTORE_PASSWORD /
// ASRAR_KEY_ALIAS / ASRAR_KEY_PASSWORD (CI). Sans l'un ni l'autre, les builds
// release sortent NON signés (à signer ensuite avec apksigner/jarsigner).
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String prop, String env -> keystoreProps.getProperty(prop) ?: System.getenv(env) }
def releaseStoreFile = signingValue('storeFile', 'ASRAR_KEYSTORE_FILE')
def hasReleaseSigning = releaseStoreFile && signingValue('storePassword', 'ASRAR_KEYSTORE_PASSWORD')

// versionCode : fourni par la CI (ASRAR_VERSION_CODE), repli 117 en local.
def asrarVersionCode = Integer.parseInt(System.getenv('ASRAR_VERSION_CODE') ?: '117')

android {
    namespace = "com.asrarpro.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        // Identifiant de l'application DÉJÀ publiée sur le Play Store — ne
        // jamais le changer (le namespace Java ci-dessus peut rester distinct).
        applicationId "com.Asrar"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Play Store : versionCode doit augmenter à CHAQUE envoi. La CI le fournit
        // via ASRAR_VERSION_CODE (100 + numéro d'exécution du workflow) ; en
        // local, repli sur la valeur 117 définie plus haut. Dernier build CI publié : 116.
        versionCode asrarVersionCode
        versionName "7.9.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    testOptions { unitTests.includeAndroidResources = true }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword signingValue('storePassword', 'ASRAR_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'ASRAR_KEY_ALIAS') ?: 'prozizou'
                keyPassword signingValue('keyPassword', 'ASRAR_KEY_PASSWORD') ?: signingValue('storePassword', 'ASRAR_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            // R8 (réduction + optimisation + obscurcissement) : exigé par les
            // normes mémoire Google Play de février 2027 (code DEX optimisé),
            // et réduit la mémoire occupée par le code. Les plugins Capacitor,
            // Unity Ads, Firebase et Play fournissent leurs règles ; les
            // compléments propres à l'app sont dans proguard-rules.pro. La table
            // de correspondance est incluse dans l'AAB (rapports de plantage
            // lisibles dans la Play Console).
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation "com.android.billingclient:billing:8.3.0"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // FirebaseApp pour AsrarNativePlugin — même version que
    // @capacitor/push-notifications (firebase-messaging).
    implementation "com.google.firebase:firebase-messaging:25.0.1"
    // Mises à jour dans l'app (Play In-App Updates), voir MainActivity.
    implementation "com.google.android.play:app-update:2.1.0"
    // Publicités récompensées (alternative à l'abonnement), voir UnityAdsPlugin.
    implementation "com.unity3d.ads:unity-ads:4.19.0"
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.robolectric:robolectric:4.16.1"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
