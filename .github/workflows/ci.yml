name: CI

# Attrape les erreurs de lint/build avant qu'elles n'arrivent en production,
# sur chaque push et chaque pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Vérification de types incrémentale (checkJs), scopée à lib/ (logique
      # métier pure) — voir tsconfig.json et ANALYSE.md.
      - run: npm run typecheck

      # Tests unitaires de lib/ (calculs Abjad/géomancie/planète, paliers
      # d'accès…) — voir lib/*.test.js.
      - run: npm test

      - run: npm run build
        env:
          # Valeurs factices : aucune route /api n'est exécutée pendant
          # `next build` (fonctions serverless, pas de génération statique
          # qui les appelle) — seules les pages sont compilées.
          FIREBASE_SERVICE_ACCOUNT: '{}'
          FIREBASE_DB_URL: https://example.firebaseio.com
          SITE_URL: https://example.com
          SUPER_ADMIN_EMAIL: admin@example.com
          WHATSAPP_NUMBER: '000000000'
          CLOUDINARY_CLOUD_NAME: example
          CLOUDINARY_API_KEY: example
          CLOUDINARY_API_SECRET: example

  # Tests E2E (Playwright, voir e2e/README.md pour le périmètre) — job séparé
  # : après lint-and-build (pas de raison de démarrer un navigateur si le
  # build est déjà cassé), avec son propre `npm run build` (les jobs GitHub
  # Actions ne partagent pas leur système de fichiers, cf. lint-and-build).
  e2e:
    needs: lint-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run build
        env:
          FIREBASE_SERVICE_ACCOUNT: '{}'
          FIREBASE_DB_URL: https://example.firebaseio.com
          SITE_URL: https://example.com
          SUPER_ADMIN_EMAIL: admin@example.com
          WHATSAPP_NUMBER: '000000000'
          CLOUDINARY_CLOUD_NAME: example
          CLOUDINARY_API_KEY: example
          CLOUDINARY_API_SECRET: example

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
