name: Planet push cron (haute fréquence)

# Envoie les notifications d'heure planétaire — abonnement global
# (PlanetPushToggle) ET alarmes web par planète (planet_web_alarms, voir
# lib/planetWebAlarms.js). Ces push doivent tomber À L'HEURE d'une planète :
# leur fenêtre d'envoi ne dure que WEB_ALARM_WINDOW_MS (≈ 6 min), bien plus
# courte qu'un jour. Or Vercel Cron (vercel.json) ne déclenche
# /api/cron/planet-push qu'UNE fois par jour sur le plan Hobby (les crons plus
# fréquents exigent le plan Pro). Ce workflow contourne la limite sans upgrade,
# comme reminders-cron.yml.
#
# GitHub Actions plafonne les cron schedules à 5 min ET les retarde souvent de
# plusieurs minutes : un seul appel toutes les 5 min raterait des occurrences.
# Le job BOUCLE donc pour appeler l'URL ≈ une fois par minute pendant ~5 min,
# ce qui couvre la fenêtre minute par minute malgré la latence de planification.
#
# Nécessite un secret de dépôt CRON_SECRET portant EXACTEMENT la même valeur
# que la variable d'environnement Vercel CRON_SECRET (voir server/cronAuth.js).
# Sans lui, chaque appel échoue en 401 (le cron Vercel quotidien reste le seul
# filet de secours). SITE_URL : variable de dépôt si le domaine diffère de la
# production.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  trigger-planet-push:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /api/cron/planet-push (≈ 1×/min pendant 5 min)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://www.asrarpro.com' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Secret CRON_SECRET absent — voir le commentaire d'en-tête de ce workflow."
            exit 1
          fi
          for i in 1 2 3 4 5; do
            code=$(curl -sS -X POST "$SITE_URL/api/cron/planet-push" \
              -H "Authorization: Bearer $CRON_SECRET" \
              --max-time 30 -o /dev/null -w "%{http_code}") || code="000"
            echo "ping $i → HTTP $code"
            if [ "$i" -lt 5 ]; then sleep 60; fi
          done
